# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "d0cda5c9003811e29e97963395e4f7f4"
name = "Refera"
# Pinned before launch on purpose. The handle is the app's identity in admin
# URLs — including the Shopify-hosted plan page at
# /store/<store>/charges/refera/pricing_plans — and changing it later breaks
# every link that already exists.
handle = "refera"
application_url = "https://refera-eight.vercel.app"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_products"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Handled by: /app/routes/webhooks.products.tsx — keeps the product mirror fresh
  [[webhooks.subscriptions]]
  uri = "/webhooks/products"
  topics = [ "products/create", "products/update", "products/delete" ]

  # Mandatory for public apps. Refera stores no shopper data, so the two customer
  # topics only acknowledge; shop/redact deletes the store's rows for real.
  # Handled by: /app/routes/webhooks.customers.data_request.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  # Handled by: /app/routes/webhooks.customers.redact.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  # Handled by: /app/routes/webhooks.shop.redact.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

[auth]
# /auth/callback, not /api/auth: `authPathPrefix` in app/shopify.server.ts is
# "/auth", and the library registers the callback under that prefix. The
# template's default pointed somewhere this app never serves.
redirect_urls = [ "https://refera-eight.vercel.app/auth/callback" ]

[build]
# Off deliberately. Left on, the next `shopify app dev` rewrites
# `application_url` above to whatever cloudflare tunnel it opened, and pushes
# that to Shopify — so a laptop starting up points every merchant at a tunnel
# that dies when the laptop sleeps.
#
# Local development therefore needs its own config file rather than this one:
#   shopify app config link --config dev
# writes shopify.app.dev.toml, and `shopify app dev --config dev` uses it.
automatically_update_urls_on_dev = false

# Send this file's contents on `shopify app deploy`, so the URLs and webhook
# subscriptions here are what Shopify actually stores.
include_config_on_deploy = true

dev_store_url = "refera-phbopjeb.myshopify.com"
